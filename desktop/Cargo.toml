[package]
name = "ringtome-desktop"
version = "0.1.2"
edition = "2021"
publish = false

# ITS OWN WORKSPACE, following the spike's precedent (see ../spike-tauri/src-tauri/Cargo.toml).
# Listed as a workspace member, Tauri and the whole webview stack would build on every
# `cargo test` and every `just ci` run, and Linux CI would grow GTK and WebKitGTK dev packages
# for a crate the gates do not test. The shell is built by its own recipe (`just desktop`) and
# joins CI at DESKTOP.md's Stage 4, where the packaging matrix arrives and there is something
# for CI to do with it.
[workspace]

# THE PROFILE TABLES, COPIED FROM THE ROOT WORKSPACE - and they must stay copied.
#
# A separate workspace inherits nothing from the root's, profiles included, and the root's are
# not a nicety: `[profile.dev.package."*"] opt-level = 2` and the rav1e/rav1d overrides are what
# keep a debug build's codecs from being 10-30x slower. Without them here, the node inside this
# app transcoded an 11KB picture in 4.2 SECONDS where the same code in the `ringtome` binary
# took 187ms - 23x, on identical input, which read as "Tauri is slow" until it was measured
# (2026-09-22). `the_desktop_workspace_keeps_the_dev_profile` in node/tests/conventions.rs fails
# if these drift from the root's.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.rav1e]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The node itself, linked in: one process, no sidecar, no second executable (DESKTOP.md).
ringtome-node = { path = "../node" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
# One use: JSON-quoting the launch token into the initialization script, so a hex string can
# never become an injection even if the minting ever changes shape.
serde_json = "1"
tracing = "0.1"
