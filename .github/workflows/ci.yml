# CI is `just ci`, verbatim - the same recipe a developer runs locally (node/justfile:
# check, clippy -D warnings, unit tests, then the two-node JS integration suite). Keeping the
# push gate identical to the local gate means the two cannot drift; everything above the last
# step is just toolchain setup.

name: CI

on:
  push:
    # Every branch, spelled out. A `push` trigger that names ONLY a tag filter stops running
    # for branch pushes altogether (GitHub's rule, learned 2026-09-23: five commits to main
    # landed with no CI run after the line below arrived alone the day before).
    branches:
      - "**"
    # A release pushes a commit AND a tag for that same commit, which would otherwise run this
    # gate twice over identical code while release.yml is already building it (2026-09-22). The
    # branch push still runs it; the tag is the duplicate.
    tags-ignore:
      - "v*"
  workflow_dispatch:

jobs:
  ci:
    # ARM (2026-08-24): same free 4-vCPU shape as ubuntu-latest, but Cobalt/Ampere hardware
    # that is newer and less oversubscribed than the x64 pool - and the stack's daily habitat
    # is already ARM64 (development happens on an M-series Mac), so this is the LESS exotic
    # target, not the more. First run after this change rebuilds cold: rust-cache keys on
    # architecture. Revert to ubuntu-latest if the aarch64 pool ever disappoints.
    runs-on: ubuntu-24.04-arm
    # 45 (2026-10-13; 30 before): a red run reruns each failing file five times (rerun.cjs),
    # and the gate itself takes ~20 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache cargo registry + target dir; the iroh dependency tree is heavy enough that this
      # is the difference between ~1 and ~10 minutes.
      #
      # cache-on-failure, because the default (save only on success) compounds red runs into
      # slow red runs: a toolchain bump invalidates the key, the first cold run fails on the
      # new toolchain's lints, saves nothing, and every run after rebuilds the world from
      # scratch until one goes green (2026-08-23: 24 minutes, ~17 of them cold compile, after
      # stable moved to 1.98 mid-red-streak).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            node/js/package-lock.json
            node/integration/package-lock.json

      - name: Build UI assets
        working-directory: node
        run: just ui-install && just ui-build

      - name: Install integration-test dependencies
        working-directory: node
        run: just integration-install

      # The machine, for the runner kills (2026-10-30): five runs since the ARM image moved to
      # 20261025.165.1 (kernel 7.0) died mid-`test-unit` with "the runner has received a shutdown
      # signal" and nothing else - no test failed, no error, and none on the image before it.
      # This says what the runner was given; the monitor in the next step says what it ran out of.
      - name: Machine
        run: |
          uname -r
          nproc
          free -m
          swapon --show || true
          df -h / /home/runner || true
          systemctl is-active systemd-oomd || true
          cat /proc/pressure/memory || true

      - name: Full check (just ci)
        working-directory: node
        # `just ci` is the gate, verbatim. Beside it, a line every 15 seconds of memory, swap,
        # disk, memory pressure and the three biggest processes - printed live, so the last
        # line before a kill survives it in this log (the runner-kill investigation above).
        run: |
          (while sleep 15; do
            echo "[machine] $(date -u +%T)" \
              "$(free -m | awk '/^Mem:/ {print "mem " $3 "/" $2 "MB, available " $7 "MB"}')" \
              "$(free -m | awk '/^Swap:/ {print "swap " $3 "/" $2 "MB"}')" \
              "disk $(df -h / | awk 'NR==2 {print $3 "/" $2}')" \
              "pressure $(head -1 /proc/pressure/memory 2>/dev/null | cut -d' ' -f2-3)" \
              "top $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s:%dMB ", $2, $1/1024}')"
          done) &
          monitor=$!
          status=0
          just ci || status=$?
          kill "$monitor"
          exit "$status"
        env:
          # Triple every time budget in the suite - the settle loops (helpers.cjs::settleWith)
          # AND mocha's per-test ceiling (.mocharc.cjs), one knob for both: five rig nodes on
          # four vCPUs of shared, noisy-neighbor hardware are legitimately 2-4x slower than a
          # dev machine, with fat tails, and 2026-08-23's CI-only reds were all fixed budgets
          # sized for local hardware. Green settles return early and green tests finish when
          # they finish, so patience costs a green run almost nothing - only failures wait
          # longer to be declared.
          RINGTOME_TEST_SETTLE_SCALE: "3"
          # One compiler at a time (2026-10-31): the runner kills were memory. The monitor above
          # caught `test-unit` compiling ringtome-node twice at once - the library and its unit
          # tests, ~7.5 GB each on this runner (2 GB on a Mac) - in 15.9 GB of RAM: 340 MB
          # free, the 3 GB of swap full, and the runs that went past that were shut down. Alone,
          # the biggest compile seen here peaks at ~9 GB. Slower when the cache is cold, since
          # dependencies build one at a time too; a warm run pays mostly for the two big ones
          # in a row rather than side by side.
          CARGO_BUILD_JOBS: "1"

      # The rig nodes' tracing logs, saved ONLY when the gate fails. Remote-only reds were
      # undiagnosable without these (2026-08-23: three CI-only integration failures whose
      # local reproductions stayed green - every diagnosis had to be guessed from mocha's
      # assert text alone, while the logs that named the mechanism evaporated with the
      # runner). Download with `gh run download <run-id>`.
      - name: Upload rig logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rig-logs
          path: /tmp/ringtome-integration*.log
          retention-days: 7
          if-no-files-found: ignore
