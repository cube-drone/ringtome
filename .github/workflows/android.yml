# The Android app: the desktop crate (desktop/, a library since 2026-10-08) built by Tauri into an
# arm64 APK, the node inside it as on every other platform (plans/MOBILE.md).
#
# Built HERE and nowhere else (Curtis, 2026-10-08): the Android SDK, the NDK and a second target
# directory of this tree don't fit beside the desktop one on a laptop that already holds ~200 GB of
# build output. The laptop keeps only `adb`, to install what this makes and to read `adb logcat`.
#
# Three ways in, and two repository variables decide the automatic ones (Settings -> Secrets and
# variables -> Actions -> Variables, or `gh variable set NAME --body true`):
#
# - every push, while `ANDROID_ON_PUSH` is `true` - for getting it working, and for a stretch of
#   intense mobile work. Unset (or anything else) and a push builds nothing here.
# - every release, while `ANDROID_IN_RELEASE` is `true`: release.yml calls this, and its `publish`
#   then refuses a set without the APK - all or nothing, as for every other platform. Left unset
#   until a push build is green, so a red Android build can never hold a desktop release back.
# - by hand (Actions -> Android -> Run workflow), whatever the variables say.
#
# And a third variable, `ANDROID_PLAY`: while it is `true`, the `aab` job builds the app bundle
# Google Play takes (plans/STORES.md, section 3) wherever `apk` builds - the same app compiled with
# `RINGTOME_STORE=play`, an `.aab` signed with the same keystore, which Play knows as the upload
# key. It is the artifact `android-play`, kept out of the GitHub Release: it is for the Play
# Console and nobody else can install it. Unset, nothing here builds one, so an unproven bundle
# build can't hold a release back; a run of this workflow by hand builds it whatever the variable
# says.
#
# Three jobs, side by side. `node` cross-compiles the node library alone - no Tauri, no Gradle - which
# is the fast answer to "does turso's bindgen and aws-lc's C build for Android", the known risk
# (plans/MOBILE.md, "the known snags"). `apk` is the whole app, signed and stashed as an artifact.
# `aab` is the whole app again, for Play.
#
# Signing: `ANDROID_KEYSTORE_BASE64` (the keystore, base64), `ANDROID_KEYSTORE_PASSWORD` and
# `ANDROID_KEY_ALIAS`, repository secrets. Absent, the APK is signed with a key made for this run
# alone - installable, but every build then has a different signature, and Android refuses to install
# one over another: uninstall first, which deletes the app's data. A release refuses that (below).

name: Android

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      project:
        description: "Only generate the Android project, untouched, and upload it (to commit as desktop/gen/android)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: "Called by release.yml: build whatever ANDROID_ON_PUSH says"
        type: boolean
        default: true

# One build per branch at a time: a newer push makes the older one moot.
concurrency:
  group: android-${{ github.ref }}-${{ inputs.release && 'release' || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && !inputs.release }}

env:
  # The NDK's own clang for API 24 (Tauri's minimum), and the sysroot bindgen needs to read Android's
  # headers rather than the runner's - turso's build script runs it (plans/MOBILE.md).
  ANDROID_API: "24"

jobs:
  # Not in a release: there the APK is the whole question, and this would only repeat its compile.
  node:
    if: ${{ !inputs.release && !inputs.project && (github.event_name == 'workflow_dispatch' || vars.ANDROID_ON_PUSH == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-node
          cache-on-failure: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/js/package-lock.json

      # The node bakes the UI into itself (`include_str!`), so the bundle exists before cargo runs.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # The runner image carries the SDK and NDKs; this points cargo and the C builds at the NDK.
      - name: The NDK's toolchain
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?the runner image has no NDK}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$bin/aarch64-linux-android${ANDROID_API}-clang"
          {
            echo "CC_aarch64_linux_android=$clang"
            echo "CXX_aarch64_linux_android=${clang}++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          } >> "$GITHUB_ENV"
          echo "NDK: $ndk"

      - name: Cross-compile the node
        run: cargo build --target aarch64-linux-android -p ringtome-node --lib

  apk:
    if: ${{ !inputs.project && (inputs.release || github.event_name == 'workflow_dispatch' || vars.ANDROID_ON_PUSH == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The runner's disk is the tightest part of this: the SDK image plus an LTO release build of
      # the node. What a Rust build never uses goes first.
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
          workspaces: desktop -> target
          cache-on-failure: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            node/js/package-lock.json
            desktop/package-lock.json

      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # The Tauri CLI, pinned in desktop/package.json: the generated Gradle project runs it back
      # through `npm run tauri` to build the Rust half, so it must be installed where it looks.
      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Tauri finds the NDK by NDK_HOME and sets the C compilers itself; bindgen still wants the
      # sysroot said.
      - name: The NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?the runner image has no NDK}"
          {
            echo "NDK_HOME=$ndk"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          } >> "$GITHUB_ENV"

      # Committed (desktop/gen/android); this checks it still carries what the app needs.
      - name: The Android project
        working-directory: desktop
        run: tools/android-project.sh

      - name: Build
        working-directory: desktop
        run: npm run tauri -- android build --ci --apk --target aarch64

      # Signed here rather than in Gradle, so the generated project needs no signing config: the
      # unsigned APK, aligned, then signed with the keystore - or a key for this run alone (header).
      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ inputs.release && 'true' || 'false' }}
        run: |
          unsigned=$(find desktop/gen/android -path '*release*' -name '*-unsigned.apk' | head -1)
          [ -n "$unsigned" ] || { echo "::error::no unsigned release APK under desktop/gen/android"; find desktop/gen/android -name '*.apk'; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          version=$(python3 -c "import json;print(json.load(open('desktop/tauri.conf.json'))['version'])")
          mkdir -p out
          apk="out/horse-drawing-tycoon-2-${version}-arm64.apk"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          elif [ "$RELEASE" = true ]; then
            echo "::error::a release APK needs the ANDROID_KEYSTORE_* secrets: one signed with a throwaway key could never be updated"
            exit 1
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64: signed with a key made for this run alone - uninstall the last build before installing this one"
            KEYSTORE_PASSWORD=throwaway-$RANDOM$RANDOM
            KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 30 -storepass "$KEYSTORE_PASSWORD" \
              -dname "CN=Horse Drawing Tycoon 2 test build" -noprompt
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -l out

      # `android-release` is the name release.yml's `publish` gathers; a push build's artifact is
      # where the phone downloads it from.
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  # Google Play's build (header): the `apk` job's setup again, then the store build as a bundle. A
  # job of its own, beside `apk`, so a release waits on the slower of the two and not on their sum
  # (Curtis, 2026-11-12: runner minutes are free for a public repository, wall-clock time is not).
  aab:
    if: ${{ !inputs.project && ((github.event_name == 'workflow_dispatch' && !inputs.release) || (vars.ANDROID_PLAY == 'true' && (inputs.release || vars.ANDROID_ON_PUSH == 'true'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The runner's disk is the tightest part of this: the SDK image plus an LTO release build of
      # the node. What a Rust build never uses goes first.
      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/@angular "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aab
          workspaces: desktop -> target
          cache-on-failure: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            node/js/package-lock.json
            desktop/package-lock.json

      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # The Tauri CLI, pinned in desktop/package.json: the generated Gradle project runs it back
      # through `npm run tauri` to build the Rust half, so it must be installed where it looks.
      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Tauri finds the NDK by NDK_HOME and sets the C compilers itself; bindgen still wants the
      # sysroot said.
      - name: The NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?the runner image has no NDK}"
          {
            echo "NDK_HOME=$ndk"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          } >> "$GITHUB_ENV"

      # Committed (desktop/gen/android); this checks it still carries what the app needs.
      - name: The Android project
        working-directory: desktop
        run: tools/android-project.sh

      # The store flag set, so the node compiles as a store build - no update notice, the age screen
      # at sign-up - and a bundle instead of an APK.
      - name: Build the Play bundle
        working-directory: desktop
        env:
          RINGTOME_STORE: play
        run: |
          npm run tauri -- android build --ci --aab --target aarch64
          # Play refuses a bundle whose version code is not above the last one it took.
          cat gen/android/app/tauri.properties

      # jarsigner, since apksigner signs only APKs. Play re-signs what people install with the key
      # it holds; this signature is the upload key's, saying the bundle is ours.
      - name: Sign the Play bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ inputs.release && 'true' || 'false' }}
        run: |
          unsigned=$(find desktop/gen/android -path '*elease*' -name '*.aab' | head -1)
          [ -n "$unsigned" ] || { echo "::error::no release bundle under desktop/gen/android"; find desktop/gen/android -name '*.aab'; exit 1; }
          version=$(python3 -c "import json;print(json.load(open('desktop/tauri.conf.json'))['version'])")
          mkdir -p play
          aab="play/horse-drawing-tycoon-2-${version}-play.aab"
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = true ]; then
              echo "::error::a Play bundle needs the ANDROID_KEYSTORE_* secrets: Play takes only what the upload key signed"
              exit 1
            fi
            echo "::warning::no ANDROID_KEYSTORE_BASE64: the bundle is unsigned, and Play will not take it"
            cp "$unsigned" "$aab"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass:env KEYSTORE_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$aab" "$unsigned" "$KEY_ALIAS"
            jarsigner -verify "$aab"
            rm -f "$RUNNER_TEMP/release.keystore"
          fi
          ls -l play

      - uses: actions/upload-artifact@v4
        with:
          name: android-play
          path: play/*.aab
          retention-days: 30
          if-no-files-found: error

  # The Android project as Tauri generates it, and nothing else (Curtis, 2026-10-08: "pull the
  # project, as generated, from CI, and we can make all changes to that from this point forward").
  # Generating it needs the SDK, which lives only here; the result is committed as
  # desktop/gen/android, and every change after that is an ordinary edit to it. No Rust is built.
  project:
    if: ${{ inputs.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # From the template, whatever the checkout holds: a committed project is set aside first, so
      # this is always the template's own output - what a later Tauri upgrade gets diffed against.
      - name: Generate
        working-directory: desktop
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:?the runner image has no NDK}"
          rm -rf gen/android
          npm run tauri -- android init --ci
          find gen/android -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: desktop/gen/android
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
