# The iOS app, begun (2026-11-22): for now the first question only - does the node cross-compile
# for an iPhone at all (plans/MOBILE.md, "The iOS build").
#
# Built HERE and nowhere else, as Android is (Curtis, 2026-11-22: "XCode on CI only - as we've
# established, this laptop is Just a Little Guy"): the laptop holds the command-line tools and no
# Xcode, so it has no iPhone SDK to compile against and no simulator to run in.
#
# Two ways in, and one repository variable decides the automatic one (`gh variable set NAME --body
# true`):
#
# - every push, while `IOS_ON_PUSH` is `true` - for getting it working, and for a stretch of iOS
#   work. Unset (or anything else) and a push builds nothing here.
# - by hand (Actions -> iOS -> Run workflow), whatever the variable says.
#
# A third, by hand with `project` ticked: the `project` job alone, which generates the Xcode project
# from Tauri's template and uploads it, to be committed as desktop/gen/apple.
#
# `node` cross-compiles the node library alone - no Tauri, no Xcode project - for a real iPhone
# (`aarch64-apple-ios`): the phone is where it has to end up, and nothing else here builds for one
# yet. The known risk was the one Android had, turso's bindgen and aws-lc's C build, and neither
# needed anything.
#
# `sim` is the whole app (2026-11-22), built by Tauri from the committed project (desktop/gen/apple)
# for the simulator on an Apple-silicon Mac (`aarch64-apple-ios-sim`, its own target with its own
# SDK), then installed in a simulated iPhone, launched and photographed: with no iPhone to hand and
# no Xcode on the laptop, the screenshots in the `ios-simulator` artifact are the only way anyone
# sees it. The app's own output, the node's log (`node.log`, from the unified log) and the node's
# `/health` ride along. Unsigned - a simulator asks for no signature.
#
# `testflight` (2026-11-27), by hand only, with `testflight` ticked: a signed release build for a real
# iPhone, uploaded to TestFlight - iOS has no sideloading, so it is the only road onto a phone.

name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      project:
        description: "Only generate the iOS project, untouched, and upload it (to commit as desktop/gen/apple)"
        type: boolean
        default: false
      testflight:
        description: "Only build a signed release for the iPhone and upload it to TestFlight"
        type: boolean
        default: false

# One build per branch at a time: a newer push makes the older one moot.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The oldest iOS the C builds aim at: the number the Xcode project carries (desktop/gen/apple,
  # project.yml's `deploymentTarget`), as Tauri's template set it.
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  node:
    if: ${{ !inputs.project && !inputs.testflight && (github.event_name == 'workflow_dispatch' || vars.IOS_ON_PUSH == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-node-${{ matrix.target }}
          cache-on-failure: true

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/js/package-lock.json

      # The node bakes the UI into itself (`include_str!`), so the bundle exists before cargo runs.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # Said in the log, so a failure below can be read against what the runner actually held.
      - name: The Xcode and SDKs on this runner
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cross-compile the node
        run: cargo build --target ${{ matrix.target }} -p ringtome-node --lib

  # The whole app, in a simulated iPhone. See the header.
  sim:
    if: ${{ !inputs.project && !inputs.testflight && (github.event_name == 'workflow_dispatch' || vars.IOS_ON_PUSH == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUNDLE_ID: net.lassam.ringtome
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios-sim

      # The app builds in the desktop crate's own workspace (desktop/target).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
          workspaces: desktop
          cache-on-failure: true

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            node/js/package-lock.json
            desktop/package-lock.json

      # The node bakes the UI into itself (`include_str!`), so the bundle exists before cargo runs.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # The Tauri CLI, pinned in desktop/package.json: the Xcode project runs it back through
      # `npm run tauri` to build the Rust half, so it must be installed where it looks.
      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: The Xcode and simulators on this runner
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # A debug build: the release profile's whole-program optimizing is long minutes this job has
      # no use for. Whatever Tauri leaves, the `.app` is found by looking.
      - name: Build
        working-directory: desktop
        run: |
          npm run tauri -- ios build --ci --debug --no-sign --target aarch64-sim
          find gen/apple -name '*.app' -maxdepth 8 -not -path '*/Externals/*'

      # The newest iPhone the runner's simulators offer, booted; the app put in it and started,
      # its own output kept; then four looks at it - the first a second in, which should be the
      # shell's starting page (the node boots after the window), the last the app.
      - name: Run it in a simulator
        run: |
          mkdir -p out
          app=$(find desktop/gen/apple -name '*.app' -maxdepth 8 -not -path '*/Externals/*' | head -1)
          [ -n "$app" ] || { echo "::error::the build left no .app under desktop/gen/apple"; exit 1; }
          echo "app: $app"
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          phones = [(runtime, d) for runtime, ds in runtimes.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          phones.sort(key=lambda p: [int(n) for n in p[0].rsplit('iOS-', 1)[-1].split('-') if n.isdigit()])
          runtime, phone = phones[-1]
          print(phone['udid'])
          print(phone['name'], 'on', runtime, file=sys.stderr)
          ")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          # With the test reclaim on (node/src/wake.rs): leaving the screen drops the node's listener
          # as iOS may, which the simulator's shared network never does - `away and back` below.
          SIMCTL_CHILD_RINGTOME_TEST_RECLAIM_ON_SUSPEND=1 \
            xcrun simctl launch --stdout="$PWD/out/app-stdout.log" --stderr="$PWD/out/app-stderr.log" "$udid" "$BUNDLE_ID"
          # A second in: the window, not the launch screen - the shell's starting page while the node
          # boots on a thread of its own (desktop/src/lib.rs, 2026-11-26), or the app already.
          sleep 1
          xcrun simctl io "$udid" screenshot "out/after-1s.png" || true
          for wait in 10 30 60; do
            sleep "$wait"
            xcrun simctl io "$udid" screenshot "out/after-${wait}s.png" || true
          done

      # A simulator shares the Mac's network, so the node inside the app answers the runner too:
      # its port is the one it wrote down in its own data (desktop/src/port.rs). Told, not
      # required - the screenshots are the verdict, and this says why when they are blank.
      - name: Is the node up
        if: ${{ always() && env.UDID != '' }}
        run: |
          xcrun simctl spawn "$UDID" launchctl list | grep -i "$BUNDLE_ID" || echo "the app is not running any more"
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)
          echo "data: $data"
          port_file=$(find "$data" -name desktop-port 2>/dev/null | head -1)
          if [ -n "$port_file" ]; then
            port=$(cat "$port_file")
            echo "the node's port: $port"
            curl -sS -m 10 "http://127.0.0.1:$port/health" | tee out/health.json || echo "nothing answered on $port"
          else
            echo "no desktop-port file: the node never chose a port"
            find "$data" -maxdepth 4 2>/dev/null | head -50
          fi

      # Suspension (plans/MOBILE.md, the iOS section): another app to the front sends ours to the
      # background - Tauri's `Suspended`, and the test reclaim drops the node's listener - and
      # launching ours again brings the same process back - `Resumed`, and the node binds its
      # listener again on the same port. The return is the verdict: the node must answer. Then
      # the other way an app goes on a phone: killed while away, as iOS does for memory, and
      # opened again onto the same data.
      - name: Away and back
        if: ${{ env.UDID != '' }}
        run: |
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          port=$(cat "$(find "$data" -name desktop-port | head -1)")
          health() { curl -sS -m 5 "http://127.0.0.1:$port/health" >/dev/null 2>&1 && echo up || echo down; }
          pid() { xcrun simctl spawn "$UDID" launchctl list | grep -i "$BUNDLE_ID" | awk '{print $1}' || true; }
          before=$(pid)
          echo "before: $(health), pid $before"
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
          sleep 15
          echo "away: $(health) (the test reclaim dropped the listener, so down is the expectation)"
          xcrun simctl io "$UDID" screenshot out/away.png || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null
          sleep 5
          back=$(health)
          echo "back: $back, pid $(pid)"
          xcrun simctl io "$UDID" screenshot out/back.png || true
          [ "$(pid)" = "$before" ] || echo "::warning::the app came back as another process ($before, now $(pid)): a relaunch, not a resume"
          xcrun simctl launch "$UDID" com.apple.Preferences > /dev/null
          sleep 3
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null
          sleep 20
          echo "killed and opened again: $(health), pid $(pid)"
          xcrun simctl io "$UDID" screenshot out/relaunched.png || true
          [ "$back" = up ] || { echo "::error::the node did not answer once the app came back"; exit 1; }

      - name: The logs
        if: ${{ always() && env.UDID != '' }}
        run: |
          echo "--- the app's own output"
          tail -n 200 out/app-stderr.log out/app-stdout.log 2>/dev/null || true
          # What the system said of it, a crash above all.
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "Horse Drawing Tycoon 2"' > out/system.log 2>&1 || true
          tail -n 60 out/system.log || true
          # The node's own log, which on iOS goes to the unified log under the bundle identifier
          # (init_tracing_with, node/src/lib.rs) - not to stdout, which Tauri forwards in a debug
          # build only, and is why app-stdout.log is empty: Tauri has the pipe. Info and debug are
          # asked for by name - `log show` leaves them out otherwise - and the window reaches back
          # past the launch, minutes ago now.
          echo "--- the node's log"
          xcrun simctl spawn "$UDID" log show --last 15m --info --debug --style compact --predicate 'subsystem == "net.lassam.ringtome"' > out/node.log 2>&1 || true
          echo "$(wc -l < out/node.log) lines"
          head -n 80 out/node.log || true

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: ios-simulator
          path: out
          retention-days: 7
          if-no-files-found: warn

  # The iOS project as Tauri generates it, and nothing else - as Android's was (android.yml,
  # `project`): generating it needs Xcode, which lives only here; the result is committed as
  # desktop/gen/apple, and every change after that is an ordinary edit to it. No Rust is built.
  # A signed release for a real iPhone, uploaded to TestFlight (plans/MOBILE.md, the iOS order's step
  # 4). By hand only: every upload is a build Apple keeps, under a build number it never takes twice
  # - this workflow's run number, which only climbs. The version people see stays tauri.conf.json's.
  #
  # Signed the automatic way: Xcode asks Apple for the distribution certificate and the App Store
  # profile itself, with an App Store Connect team key - which takes the Admin role (Curtis's
  # notarizing key is a Developer's, enough to upload and not to make either; 2026-11-27). Its
  # three secrets: `APPLE_IOS_API_KEY_BASE64` (the .p8, base64), `APPLE_IOS_API_KEY` (its ID) and
  # `APPLE_IOS_API_ISSUER`. The team is the one the Mac releases are signed by, read off 0.7.6's
  # signature - an identifier, not a secret.
  testflight:
    if: ${{ inputs.testflight && !inputs.project }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APPLE_DEVELOPMENT_TEAM: TKX92WMGSW
      APPLE_API_KEY: ${{ secrets.APPLE_IOS_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_IOS_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-testflight
          workspaces: desktop
          cache-on-failure: true

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            node/js/package-lock.json
            desktop/package-lock.json

      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # Written where `altool` looks for it by its ID (~/.appstoreconnect/private_keys), and named
      # to Tauri, which hands it to xcodebuild for the signing, by path.
      - name: The App Store Connect key
        env:
          KEY_BASE64: ${{ secrets.APPLE_IOS_API_KEY_BASE64 }}
        run: |
          for name in KEY_BASE64 APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: the APPLE_IOS_API_* secrets are missing"; exit 1; }
          done
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$key"
          head -1 "$key" | grep -q 'BEGIN PRIVATE KEY' || { echo "::error::APPLE_IOS_API_KEY_BASE64 does not decode to a .p8"; exit 1; }
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # The build number as CFBundleVersion, alone: Apple wants it new for every upload.
      - name: Build
        working-directory: desktop
        run: |
          npm run tauri -- ios build --ci --target aarch64 --export-method app-store-connect \
            --config '{"bundle":{"iOS":{"bundleVersion":"${{ github.run_number }}"}}}'
          find gen/apple -name '*.ipa' -not -path '*/Externals/*'

      # Apple checks the build on the way in; a refusal names what is missing (a privacy manifest,
      # an icon, a usage description) and fails this step. Accepted, the build appears in App Store
      # Connect's TestFlight tab after Apple's processing - minutes, sometimes an hour.
      - name: Upload to TestFlight
        run: |
          ipa=$(find desktop/gen/apple -name '*.ipa' -not -path '*/Externals/*' | head -1)
          [ -n "$ipa" ] || { echo "::error::the build left no .ipa under desktop/gen/apple"; exit 1; }
          echo "ipa: $ipa ($(du -h "$ipa" | cut -f1)), build ${{ github.run_number }}"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  project:
    if: ${{ inputs.project }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `tauri ios init` asks rustup for the iOS targets; here they are already.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # What the template is turned into an Xcode project with. Tauri would fetch it itself; asked
      # for here so that a failure to get it reads as that.
      - name: XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # From the template, whatever the checkout holds: a committed project is set aside first, so
      # this is always the template's own output - what a later Tauri upgrade gets diffed against.
      - name: Generate
        working-directory: desktop
        run: |
          xcodebuild -version
          rm -rf gen/apple
          npm run tauri -- ios init --ci
          find gen/apple -type f | sort

      - uses: actions/upload-artifact@v6
        with:
          name: ios-project
          path: desktop/gen/apple
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
