# The iOS app, begun (2026-11-22): for now the first question only - does the node cross-compile
# for an iPhone at all (plans/MOBILE.md, "The iOS build").
#
# Built HERE and nowhere else, as Android is (Curtis, 2026-11-22: "XCode on CI only - as we've
# established, this laptop is Just a Little Guy"): the laptop holds the command-line tools and no
# Xcode, so it has no iPhone SDK to compile against and no simulator to run in.
#
# Two ways in, and one repository variable decides the automatic one (`gh variable set NAME --body
# true`):
#
# - every push, while `IOS_ON_PUSH` is `true` - for getting it working, and for a stretch of iOS
#   work. Unset (or anything else) and a push builds nothing here.
# - by hand (Actions -> iOS -> Run workflow), whatever the variable says.
#
# A third, by hand with `project` ticked: the `project` job alone, which generates the Xcode project
# from Tauri's template and uploads it, to be committed as desktop/gen/apple.
#
# `node`, twice over, cross-compiles the node library alone - no Tauri, no Xcode project -
# for a real iPhone (`aarch64-apple-ios`) and for the simulator on an Apple-silicon Mac
# (`aarch64-apple-ios-sim`), which are different targets with different SDKs: the simulator is where
# the app will first be seen, with no iPhone to hand, and the phone is where it has to end up. The
# known risk is the one Android had: turso's bindgen and aws-lc's C build.

name: iOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      project:
        description: "Only generate the iOS project, untouched, and upload it (to commit as desktop/gen/apple)"
        type: boolean
        default: false

# One build per branch at a time: a newer push makes the older one moot.
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The oldest iOS the C builds aim at: the number the Xcode project carries (desktop/gen/apple,
  # project.yml's `deploymentTarget`), as Tauri's template set it.
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

jobs:
  node:
    if: ${{ !inputs.project && (github.event_name == 'workflow_dispatch' || vars.IOS_ON_PUSH == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      # Each target answers for itself: the phone failing says nothing about the simulator.
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-node-${{ matrix.target }}
          cache-on-failure: true

      - uses: extractions/setup-just@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/js/package-lock.json

      # The node bakes the UI into itself (`include_str!`), so the bundle exists before cargo runs.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # Said in the log, so a failure below can be read against what the runner actually held.
      - name: The Xcode and SDKs on this runner
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cross-compile the node
        run: cargo build --target ${{ matrix.target }} -p ringtome-node --lib

  # The iOS project as Tauri generates it, and nothing else - as Android's was (android.yml,
  # `project`): generating it needs Xcode, which lives only here; the result is committed as
  # desktop/gen/apple, and every change after that is an ordinary edit to it. No Rust is built.
  project:
    if: ${{ inputs.project }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `tauri ios init` asks rustup for the iOS targets; here they are already.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: The Tauri CLI
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # What the template is turned into an Xcode project with. Tauri would fetch it itself; asked
      # for here so that a failure to get it reads as that.
      - name: XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      # From the template, whatever the checkout holds: a committed project is set aside first, so
      # this is always the template's own output - what a later Tauri upgrade gets diffed against.
      - name: Generate
        working-directory: desktop
        run: |
          xcodebuild -version
          rm -rf gen/apple
          npm run tauri -- ios init --ci
          find gen/apple -type f | sort

      - uses: actions/upload-artifact@v6
        with:
          name: ios-project
          path: desktop/gen/apple
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
