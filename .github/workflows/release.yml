# The expensive half: a tag builds the app for every platform, signs what can be signed, and
# publishes a GitHub Release with the installers and the updater's manifest.
#
# ALL OR NOTHING (Curtis, 2026-09-25). Every build job only BUILDS: its artifacts are stashed on the
# run, and no build job can touch the release (its token is read-only). The last job, `publish`,
# runs only when every build, the server signing and the image all succeeded; it checks the set is
# whole (node/tools/release-assemble.mjs), writes the desktop updater's `latest.json`, uploads it all
# to a draft, tags the image, and only then turns the draft into the release. Until that moment
# nothing is visible: a draft is invisible to `releases/latest`, which is where both updaters look.
# Before this, 0.1.10 went out to Linux and Windows while its Mac build - built and notarized - lost
# its upload to a DNS failure, and six of nine tagged releases had some part fail.
#
# When a job fails, "Re-run failed jobs" retries it and then `publish`; a failure in `publish` itself
# (an upload, say) is a re-run of that one job, with nothing rebuilt.
#
# It is deliberately NOT on push. `just release-*` makes the tag by hand (node/tools/release.mjs),
# and the tag is the whole gate: a release is a full optimized build of four artifacts, notarized by
# Apple, handed to every installed copy as a complete new application. `just ci` remains the
# per-commit gate and never builds Tauri - that is why `desktop/` is its own workspace.
#
# Credentials come from the `deploy` environment (SIGNING.md), and the build degrades rather than
# fails when one is absent: no Apple credentials means an unsigned macOS build, no Azure variables an
# unsigned Windows one, each with a line in the log - a half-signed release is better than none.
# Windows signs through Azure Artifact Signing with no secret at all: the job asks GitHub for an
# OIDC token and Azure accepts it (`id-token: write` below), so there is nothing to paste or rotate.

name: Release

on:
  push:
    tags:
      - "v*"
  # A packaging dry run: builds every target and uploads the artifacts, creates no release.
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize the macOS build (Apple's queue has an unbounded tail; off for iteration)"
        type: boolean
        default: false

jobs:
  # Ten seconds of checking before ninety minutes of building. Every secret here arrives by
  # copy-and-paste, and a paste can carry what a terminal DREW rather than what the file held -
  # zsh's trailing `%` for "no newline" is the one that cost the first release run, twenty
  # minutes in, with `base64: error decoding input stream` as its only explanation. This says
  # which secret is wrong, in its shape rather than its contents, before the runners warm up.
  preflight:
    environment: deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the secrets' shapes
        env:
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          # Azure's six are environment VARIABLES, not secrets: none of them is confidential (the
          # OIDC federation is what proves the job is ours), and a variable can be read back and
          # checked by eye, which a secret cannot.
          AZ_CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          AZ_TENANT: ${{ vars.AZURE_TENANT_ID }}
          AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZ_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          bad=0
          # Reports the SHAPE of a secret and never its contents: a length, a verdict, and for a
          # malformed one the count of characters that have no business being there.
          check_base64 () {
            local name="$1" value="$2" wanted="$3"
            if [ -z "$value" ]; then echo "  $name: absent (that step will be skipped)"; return; fi
            local clean dropped decoded
            clean="$(printf '%s' "$value" | tr -cd 'A-Za-z0-9+/=')"
            dropped=$(( ${#value} - ${#clean} ))
            decoded="$(printf '%s' "$clean" | base64 -d 2>/dev/null | head -c 120 || true)"
            if printf '%s' "$decoded" | grep -q "$wanted"; then
              echo "  $name: ok (${#value} chars)"
            else
              echo "  $name: MALFORMED - ${#value} chars, $dropped of them not base64, and what it decodes to does not contain '$wanted'"
              bad=1
            fi
          }
          echo "secrets in the deploy environment:"
          check_base64 TAURI_SIGNING_PRIVATE_KEY "$TAURI_KEY" "untrusted comment"
          check_base64 APPLE_API_KEY_BASE64 "$APPLE_KEY" "BEGIN PRIVATE KEY"
          # A .p12 is binary, so its decoded head is not text to match on: size is the signal.
          if [ -n "$APPLE_CERT" ]; then
            size=$(printf '%s' "$APPLE_CERT" | tr -cd 'A-Za-z0-9+/=' | base64 -d 2>/dev/null | wc -c)
            if [ "$size" -gt 1000 ]; then echo "  APPLE_CERTIFICATE: ok (decodes to $size bytes)";
            else echo "  APPLE_CERTIFICATE: MALFORMED - decodes to $size bytes, which is too small for a .p12"; bad=1; fi
          else
            echo "  APPLE_CERTIFICATE: absent (the Mac build will be unsigned)"
          fi
          case "$APPLE_IDENTITY" in
            "") echo "  APPLE_SIGNING_IDENTITY: absent" ;;
            "Developer ID Application: "*"("*")") echo "  APPLE_SIGNING_IDENTITY: ok" ;;
            *) echo "  APPLE_SIGNING_IDENTITY: MALFORMED - expected 'Developer ID Application: Name (TEAMID)'"; bad=1 ;;
          esac
          [ -z "$APPLE_ISSUER" ] && echo "  APPLE_API_ISSUER: absent" || echo "  APPLE_API_ISSUER: ${#APPLE_ISSUER} chars"
          [ -z "$APPLE_KEY_ID" ] && echo "  APPLE_API_KEY: absent" || echo "  APPLE_API_KEY: ${#APPLE_KEY_ID} chars"
          echo "variables in the deploy environment (Windows signing):"
          # All six or none: a partial set means an azure/login that fails or a signtool that
          # 403s forty minutes in, and either is better learned here.
          azure_set=0; azure_total=6
          check_guid () {
            local name="$1" value="$2"
            if [ -z "$value" ]; then echo "  $name: absent"; return; fi
            azure_set=$((azure_set + 1))
            if printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$'; then
              echo "  $name: ok"
            else
              echo "  $name: MALFORMED - expected a GUID"; bad=1
            fi
          }
          check_guid AZURE_CLIENT_ID "$AZ_CLIENT"
          check_guid AZURE_TENANT_ID "$AZ_TENANT"
          check_guid AZURE_SUBSCRIPTION_ID "$AZ_SUBSCRIPTION"
          if [ -z "$AZ_ENDPOINT" ]; then echo "  AZURE_SIGNING_ENDPOINT: absent";
          else
            azure_set=$((azure_set + 1))
            if printf '%s' "$AZ_ENDPOINT" | grep -Eq '^https://[a-z0-9]+\.codesigning\.azure\.net/?$'; then
              echo "  AZURE_SIGNING_ENDPOINT: ok ($AZ_ENDPOINT)"
            else
              echo "  AZURE_SIGNING_ENDPOINT: MALFORMED - expected https://<region>.codesigning.azure.net (SIGNING.md section 2 has the table)"; bad=1
            fi
          fi
          for pair in "AZURE_SIGNING_ACCOUNT=$AZ_ACCOUNT" "AZURE_SIGNING_PROFILE=$AZ_PROFILE"; do
            name="${pair%%=*}"; value="${pair#*=}"
            if [ -z "$value" ]; then echo "  $name: absent"; else azure_set=$((azure_set + 1)); echo "  $name: ok ($value)"; fi
          done
          if [ "$azure_set" -eq 0 ]; then
            echo "  (none set: the Windows build will be unsigned)"
          elif [ "$azure_set" -ne "$azure_total" ]; then
            echo "::error::$azure_set of $azure_total Azure variables are set; Windows signing needs all of them or none"
            bad=1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::a credential is malformed - see above. Set secrets from the file rather than the clipboard: gh secret set NAME --env deploy < file; variables with gh variable set NAME --env deploy --body VALUE"
            exit 1
          fi

  build:
    needs: preflight
    environment: deploy
    permissions:
      # Read-only on purpose: a build stashes its artifacts and cannot publish anything, so a
      # platform that fails cannot leave the others shipped without it (see the header).
      contents: read
      # The Windows signer's whole credential: GitHub mints an OIDC token naming this repo and
      # the `deploy` environment, and the Azure app's federated credential trusts exactly that.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS artifact rather than two: a universal binary is ~1.5x the size and half the
          # explaining when handing a .dmg to somebody.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04 rather than the newest: an AppImage built against a newer glibc refuses to run on
          # older distributions, and the point of an AppImage is that it runs anywhere.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          # Verbose, because the bundler reports a failed sign command as `failed to run
          # powershell` and prints what the command actually said only at this level
          # (2026-09-23, the first signed Windows run).
          - platform: windows-latest
            args: --verbose
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          # The notes live in the tag's own annotation, written by `just release-*`.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Two workspaces: the node's and the shell's own (DESKTOP.md, Stage 2).
          workspaces: |
            . -> target
            desktop -> target
          cache-on-failure: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/js/package-lock.json

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev

      # The node bakes the UI into its binary (`include_str!`), so the bundle has to exist before
      # cargo runs. Same two commands a developer runs; `just desktop` does this for them.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # Apple's notarization key is a FILE, so the secret is its base64 and this writes it out.
      # Skipped, with the rest of the Apple environment, when the secret is not there yet.
      # Notarization is skipped on a dispatch run unless asked for: Apple's notary queue is
      # usually minutes and occasionally HOURS, and a stuck one blocks the artifacts entirely
      # (2026-09-22: over an hour, with Apple's own status page reporting no incident). A tag is
      # a real release and always notarizes; a dispatch is for finding out what the pipeline
      # gets wrong, where waiting on Apple teaches nothing.
      - name: Apple notarization key
        if: matrix.platform == 'macos-latest' && (github.event_name != 'workflow_dispatch' || inputs.notarize)
        env:
          KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          # Guarded in bash rather than in `if:`, so the absence of a secret is a skipped step
          # rather than an expression that has to be right about when secrets are visible.
          if [ -z "$KEY_BASE64" ]; then
            echo "no App Store Connect key: this build will be signed but not notarized"
            exit 0
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey.p8"
          # The secret may hold the `.p8` ITSELF (it is PEM text, perfectly pasteable) or its
          # base64, and which one got pasted six weeks ago is not something anybody should have
          # to remember - a wrong guess surfaces as `base64: error decoding input stream`, three
          # steps from the cause (2026-09-22, the first release run). So: accept either, strip
          # whatever wrapping the paste picked up, and check the RESULT rather than the input.
          if printf '%s' "$KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$KEY_BASE64" > "$KEY_PATH"
          else
            # Everything outside the base64 alphabet goes: a paste from a terminal can carry
            # soft-wrap whitespace, and zsh prints a trailing `%` to mean "no newline here" that
            # is very easy to select along with the value (2026-09-22, the first release run -
            # the file on disk decoded perfectly, so the difference was in the paste).
            CLEAN="$(printf '%s' "$KEY_BASE64" | tr -cd 'A-Za-z0-9+/=')"
            DROPPED=$(( ${#KEY_BASE64} - ${#CLEAN} ))
            # `[ ... ] && echo` would be the last command's status, and this step runs under
            # `bash -e`: a CLEAN secret would then exit here, succeeding its way into a failure.
            if [ "$DROPPED" -gt 0 ]; then
              echo "note: dropped $DROPPED character(s) that are not base64"
            fi
            printf '%s' "$CLEAN" | base64 -d > "$KEY_PATH" 2>/dev/null \
              || printf '%s' "$CLEAN" | base64 -D > "$KEY_PATH" 2>/dev/null || true
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            # Diagnosis without disclosure: the shape of the secret, never the secret.
            echo "::error::APPLE_API_KEY_BASE64 did not yield a private key. It is ${#KEY_BASE64} characters long; a base64'd .p8 is usually ~340 and ends in '='. Re-set it with: openssl base64 -A -in AuthKey_XXXXXXXX.p8 | pbcopy"
            exit 1
          fi
          echo "notarization key ready (${#KEY_BASE64} characters in, $(wc -c < "$KEY_PATH") bytes out)"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Windows signing (SIGNING.md section 2). Both steps are skipped entirely when the Azure
      # variables are absent, and the sign script then leaves every file unsigned with a note.
      - name: Azure login (OIDC)
        if: matrix.platform == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Microsoft's own route: signtool from the Windows SDK build tools with the Artifact
      # Signing dlib plugged in, both fetched as NuGet packages so nothing depends on what the
      # runner image happens to carry (the dlib refuses SDK builds older than 10.0.2261). The
      # metadata file is what the dlib reads; the credentials it tries are cut down to the one
      # that can work here, so a failure is one clear 401 rather than a tour of every method.
      - name: Azure signing tools
        if: matrix.platform == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          AZ_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "azsign"
          New-Item -ItemType Directory -Force $tools | Out-Null
          nuget install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $tools | Out-Null
          nuget install Microsoft.ArtifactSigning.Client -x -OutputDirectory $tools | Out-Null
          $signtool = Get-ChildItem -Path $tools -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          $dlib = Get-ChildItem -Path $tools -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) {
            Write-Error "could not find signtool.exe ($signtool) or the Artifact Signing dlib ($dlib) under $tools"
            exit 1
          }
          $metadata = Join-Path $tools "metadata.json"
          @{
            Endpoint = $env:AZ_ENDPOINT
            CodeSigningAccountName = $env:AZ_ACCOUNT
            CertificateProfileName = $env:AZ_PROFILE
            CorrelationId = "ringtome $env:GITHUB_REF_NAME $env:GITHUB_RUN_ID"
            ExcludeCredentials = @(
              "EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          "RINGTOME_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "RINGTOME_SIGN_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "RINGTOME_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV
          # The bundler's sign command, as a config merged into the build (`--config` below)
          # rather than a file in the repo: the bundler runs the command from whatever the
          # process's working directory happens to be, so the script's path has to be absolute,
          # and an absolute runner path is nothing to commit. A local Windows build, with no
          # such config, is simply unsigned.
          $script = Join-Path $env:GITHUB_WORKSPACE "desktop\tools\sign-windows.ps1"
          $signConfig = Join-Path $tools "sign.json"
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = "powershell"
                  args = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $script, "%1")
                }
              }
            }
          } | ConvertTo-Json -Depth 6 | Set-Content -Path $signConfig -Encoding utf8
          "RINGTOME_SIGN_CONFIG=$signConfig" >> $env:GITHUB_ENV
          Write-Host "signtool: $($signtool.FullName)"
          Write-Host "dlib:     $($dlib.FullName)"
          Write-Host "script:   $script"
          Write-Host "account:  $env:AZ_ACCOUNT / $env:AZ_PROFILE at $env:AZ_ENDPOINT"

      # No tagName and no releaseId: tauri-action builds, bundles and signs, and publishes nothing.
      # The updater's `.sig` files come from the bundler itself (`createUpdaterArtifacts`).
      - name: Build and sign
        uses: tauri-apps/tauri-action@v0
        env:
          # The updater's own signature (SIGNING.md §0): minisign over the update artifact, checked
          # by the installed app against the public key baked into it. Nothing to do with Apple.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple: identity + certificate sign it, the API key notarizes it. All four have to be
          # present or the bundler simply skips signing, which is what we want while enrolment is
          # still in flight rather than a failed release.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Empty on an un-notarized run: the bundler notarizes if and only if it has credentials,
          # so withholding them IS the switch.
          APPLE_API_ISSUER: ${{ (github.event_name != 'workflow_dispatch' || inputs.notarize) && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ (github.event_name != 'workflow_dispatch' || inputs.notarize) && secrets.APPLE_API_KEY || '' }}
          # Windows: the `--config` in `args` names desktop/tools/sign-windows.ps1 as the bundler's
          # sign command; the script reads the RINGTOME_SIGN_* paths the tools step exported, and
          # these two are what it logs in with - freshly, per signature, because the OIDC token
          # `azure/login` used above is five minutes old by the time the build finishes.
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          # Read-only here (the job's permissions), so it can read and never publish.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # Plus the Windows sign command, when the tools step wrote one (RINGTOME_SIGN_CONFIG
          # is empty on every other platform and on a Windows run without the Azure variables).
          args: ${{ matrix.args }}${{ env.RINGTOME_SIGN_CONFIG != '' && format(' --config {0}', env.RINGTOME_SIGN_CONFIG) || '' }}

      # The sign script keeps its own transcript (desktop/tools/sign-windows.ps1) because the
      # bundler shows none of its output on failure; this puts it in the log where it belongs.
      - name: Windows signing transcript
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "no transcript: the sign script never started - the --verbose build log above has the bundler's own words" }

      # The stash: every installer and every updater signature, for `publish` (or, on a dry run,
      # for whoever is debugging the pipeline). A build that produced nothing fails here.
      - name: Stash the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/target/**/release/bundle/**/*.dmg
            desktop/target/**/release/bundle/**/*.app.tar.gz
            desktop/target/**/release/bundle/**/*.app.tar.gz.sig
            desktop/target/**/release/bundle/**/*.AppImage
            desktop/target/**/release/bundle/**/*.AppImage.sig
            desktop/target/**/release/bundle/**/*.deb
            desktop/target/**/release/bundle/**/*.deb.sig
            desktop/target/**/release/bundle/**/*.rpm
            desktop/target/**/release/bundle/**/*.rpm.sig
            desktop/target/**/release/bundle/**/*.exe
            desktop/target/**/release/bundle/**/*.exe.sig
            desktop/target/**/release/bundle/**/*.msi
            desktop/target/**/release/bundle/**/*.msi.sig
          if-no-files-found: error

  # The SERVER node (SERVER.md): the same `ringtome` binary an operator runs, built per architecture
  # on the architecture itself - no cross-compiling - inside PyPA's manylinux_2_28 image (AlmaLinux 8,
  # maintained to 2029, a modern gcc and git and curl already in it), so it needs nothing newer than
  # glibc 2.28 and runs on RHEL 8, Debian 10, Ubuntu 20.04 and everything after. That image exists
  # for exactly this - binaries that run on almost any Linux - which is why it replaced Debian 11,
  # whose security updates left the main mirror when its support ended (2026-09-25: every apt fetch
  # 404'd). Not cargo-zigbuild: the same idea with plain gcc, `aws-lc-sys` - the node's one piece of
  # C - on its most-trodden path. Everything the desktop jobs need (signing, the deploy environment)
  # is absent here on purpose: a server binary is signed by nobody and needs no secret.
  server:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            docker: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.arch }}
          cache-on-failure: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The node bakes the UI into the binary, so the bundle exists before cargo runs - the same
      # two recipes a developer and the desktop jobs use.
      - name: Build the UI assets
        working-directory: node
        run: just ui-install && just ui-build

      # The supervisor rides in the same tarball: the stable parent that runs, updates and backs up
      # the node (SERVER.md, "The supervisor"). Same versions, same glibc floor, same job.
      - name: Build the server node and its supervisor
        run: cargo build --release --locked -p ringtome-node --bin ringtome -p ringtome-supervisor

      # The promise this job exists to keep, checked rather than assumed: the newest glibc symbol
      # the binary asks for.
      - name: glibc baseline
        run: |
          for binary in ringtome ringtome-supervisor; do
            newest=$(objdump -T "target/release/$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            minor=$(printf '%s' "$newest" | cut -d_ -f2 | cut -d. -f2)
            echo "$binary: newest glibc symbol $newest"
            if [ "$minor" -gt 28 ]; then
              echo "::error::$binary needs $newest, newer than the 2.28 baseline"
              exit 1
            fi
          done

      # Named so nobody mistakes it for the desktop app: `ringtome-server-<version>-<name>-linux-<arch>`
      # beside Tauri's `Horse Drawing Tycoon 2_...` installers. The release name is derived from the
      # version exactly as `just release-*` derived the tag (node/js/pure/releasename.js).
      - name: Package
        id: package
        run: |
          version=$(grep -m1 '^version = ' node/Cargo.toml | cut -d'"' -f2)
          full=$(node -e "import('./node/js/pure/releasename.js').then(m => process.stdout.write(m.releaseTag('$version')))")
          name="ringtome-server-${full}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name" "image/${{ matrix.docker }}"
          cp target/release/ringtome target/release/ringtome-supervisor SERVER.md LICENSE.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp target/release/ringtome "image/${{ matrix.docker }}/ringtome"
          echo "packaged $name"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: image-bin-${{ matrix.docker }}
          path: image/

  # The server tarballs, SIGNED, with the manifest a supervisor polls - stashed for `publish`, like
  # everything else.
  #
  # Signed with the desktop updater's own key (SIGNING.md §0) - one key, one public half already in
  # desktop/tauri.conf.json - because the thing that will download these and run them unattended is
  # the server's updater: ringtome-supervisor (`supervisor/`). This is the one server job in
  # the `deploy` environment, and only because it holds that key.
  server-sign:
    needs: server
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    environment: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `tauri signer sign` writes <file>.sig: base64 of a minisign signature - the format the
      # desktop's latest.json carries, and what the supervisor will verify.
      - name: Sign the server tarballs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in dist/*.tar.gz; do
            npx --yes @tauri-apps/cli@2 signer sign "$f"
          done
          ls -l dist

      # Proven, not assumed: every signature verifies with the stock minisign tool against the
      # PUBLIC key committed in desktop/tauri.conf.json. A wrong key, a wrong password or a format
      # the supervisor would refuse fails the release here instead of shipping.
      - name: Verify the signatures against the committed public key
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          python3 -c "import json,base64;print(base64.b64decode(json.load(open('desktop/tauri.conf.json'))['plugins']['updater']['pubkey']).decode())" > pubkey.minisign
          for f in dist/*.tar.gz; do
            base64 -d "$f.sig" > "$f.minisig"
            minisign -V -p pubkey.minisign -m "$f" -x "$f.minisig"
            rm "$f.minisig"
          done

      # The supervisor's one fixed address: releases/latest/download/server-latest.json.
      - name: The server manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, re, datetime
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          platforms = {}
          for tarball in sorted(glob.glob("dist/*.tar.gz")):
              name = os.path.basename(tarball)
              arch = re.search(r"-linux-(x86_64|aarch64)\.tar\.gz$", name).group(1)
              platforms[f"linux-{arch}"] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "signature": open(tarball + ".sig").read().strip(),
                  "sha256": open(tarball + ".sha256").read().split()[0],
              }
          version = tag[1:].split("-")[0]
          manifest = {
              "version": version,
              "name": tag[1:],
              "tag": tag,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              "platforms": platforms,
          }
          json.dump(manifest, open("dist/server-latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: server-release
          path: dist/*
          if-no-files-found: error

  # The container: the two binaries above on distroless/cc, one multi-arch image. On a tag it is
  # pushed to GHCR BY DIGEST ONLY - present, signed, and named by no tag, so nobody pulls it yet;
  # `publish` gives it `:<version>`, `:<version>-<name>` and `:latest` with the rest of the release.
  # On a dry run it is built and not pushed, which still proves the Dockerfile.
  image:
    needs: server
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # cosign's keyless signing: GitHub mints an OIDC token naming this workflow, Sigstore
      # certifies it for a moment, and the signature says "built by cube-drone/ringtome's release
      # workflow at this tag" - no key to keep, nothing to rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: image-bin-*
          merge-multiple: true
          path: server/bin

      - name: Tags
        id: tags
        run: |
          version=$(grep -m1 '^version = ' node/Cargo.toml | cut -d'"' -f2)
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # By digest on a tag (the bare name), by version on a dry run (never pushed).
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tags=${image}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:${version}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          # The push, by digest: the image lands in the registry with no tag to pull it by.
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && 'type=image,push-by-digest=true,name-canonical=true,push=true' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=ringtome
            org.opencontainers.image.description=A Ringtome server node - the protocol under Horse Drawing Tycoon 2 (SERVER.md)
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      # Keyless (Sigstore): anyone can check the image came from this repository's release workflow
      # at a release tag - SERVER.md has the `cosign verify` line. Signed by DIGEST, never by tag:
      # a tag can move, a digest is the image - and `publish` tags exactly this digest.
      - uses: sigstore/cosign-installer@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Sign the image
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"

  # The gate. Runs only when EVERY job above succeeded (no `always()`: a failed or skipped need
  # skips this), and it is the only job that can make anything visible. Order matters: everything
  # invisible first (the whole set checked, uploaded to a draft), then the two visible acts back to
  # back - the image's tags, then the release. A failure between those two is a re-run of this job,
  # which is safe to repeat: it reuses the draft, re-uploads with --clobber, re-tags the same digest.
  publish:
    needs: [build, server-sign, image]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: "{desktop-*,server-release}"
          path: artifacts

      # The notes `just release-*` wrote (the tagged commit's message), which also go into
      # latest.json for the desktop's "what's new".
      - name: Is the set whole?
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$NOTES" > notes.txt
          node node/tools/release-assemble.mjs "$TAG" artifacts release notes.txt

      # The same check the supervisor and the installed apps make, made first: every updater
      # signature verifies against the public key committed in desktop/tauri.conf.json.
      - name: Verify every updater signature
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          python3 -c "import json,base64;print(base64.b64decode(json.load(open('desktop/tauri.conf.json'))['plugins']['updater']['pubkey']).decode())" > pubkey.minisign
          for sig in release/*.sig; do
            base64 -d "$sig" > check.minisig
            minisign -V -q -p pubkey.minisign -m "${sig%.sig}" -x check.minisig
            echo "verified ${sig%.sig}"
          done

      - name: Upload to a draft
        run: |
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            {
              cat notes.txt
              echo
              echo "### Which download is which"
              echo
              echo "- **Horse Drawing Tycoon 2** (\`.dmg\`, \`.exe\`, \`.msi\`, \`.AppImage\`, \`.deb\`, \`.rpm\`) - the desktop app: a window and a tray, and it updates itself."
              echo "- **\`ringtome-server-...-linux-x86_64\` / \`-aarch64\`** - the server node for a Linux host (glibc 2.28+): the node, and \`ringtome-supervisor\` to keep it running, updated and backed up. Also \`ghcr.io/cube-drone/ringtome:${TAG#v}\`. See [SERVER.md](https://github.com/${REPO}/blob/${TAG}/SERVER.md)."
            } > body.md
            gh release create "$TAG" -R "$REPO" --verify-tag --draft --title "$TAG" --notes-file body.md
          fi
          gh release upload "$TAG" -R "$REPO" --clobber release/*

      - uses: imjasonh/setup-crane@v0.4

      # `crane tag` adds a tag to the manifest already in the registry - the digest cosign signed -
      # rather than building a new one.
      - name: Tag the image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(grep -m1 '^version = ' node/Cargo.toml | cut -d'"' -f2)
          for tag in "$version" "${TAG#v}" latest; do
            crane tag "${image}@${DIGEST}" "$tag"
          done

      - name: Release
        run: gh release edit "$TAG" -R "$REPO" --draft=false --latest
