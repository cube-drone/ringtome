[package]
name = "ringtome-node"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ringtome"
path = "src/main.rs"

[dependencies]
# the protocol layer: canonical bytes, hashing, signing, chain validation
ringtome-proto = { path = "../proto" }

# web service
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1", features = ["full"] }

# password hashing (node login)
argon2 = "0.5"

# identity keypairs and envelope encryption of private keys at rest
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hex = "0.4"

# error handling
anyhow = "1"
thiserror = "2"

# (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ids
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }

# secure randomness (session tokens)
rand = "0.8"

# local database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

# bounded cache of open per-user database handles
moka = { version = "0.12", features = ["future"] }
iroh = "1.0.2"
pkarr = "5"
base64 = "0.22.1"
dryoc = "0.8.0"
iroh-blobs = "0.103.0"
diffy = "0.5"
