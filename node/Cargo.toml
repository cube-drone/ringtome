[package]
name = "ringtome-node"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ringtome"
path = "src/main.rs"

[dependencies]
# The Marquee reference parser (our own, ~/code/marqueemarkup): publication's media pre-pass
# walks the AST for embed targets rather than regexing source. Pinned like turso: pre-1.0.
cube-drone-marquee-parser = "=0.7.1"
# And its batteries-included sibling, for the OpenGraph parse behind link cards: the browser
# cannot fetch a page across origins, so the node fetches and this crate reads the head -
# the same entity table and rules as the npm turbolink package, kept in one place (2026-09-03,
# after a hand-rolled port grew a third copy of the table).
cube-drone-marquee-markup = "=0.7.1"
# the protocol layer: canonical bytes, hashing, signing, chain validation
ringtome-proto = { path = "../proto" }

# web service
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1", features = ["full"] }

# password hashing (node login)
argon2 = "0.5"

# identity keypairs and envelope encryption of private keys at rest
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hex = "0.4"

# error handling
anyhow = "1"
thiserror = "2"

# (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ids
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }

# secure randomness (session tokens)
rand = "0.8"

# local database: Turso (SQLite-compatible rewrite) with native at-rest encryption. Exact pin -
# the crate is pre-1.0 and the encryption surface is experimental; upgrades are deliberate acts.
turso = "=0.7.0"

# bounded cache of open per-user database handles
moka = { version = "0.12", features = ["future"] }
iroh = "1.0.2"
pkarr = "5"
# Outbound HTTP for the turbolink unfurl endpoint (net::unfurl) - already in the tree via
# pkarr, so this direct dependency costs nothing new. rustls only, no native TLS.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
url = "2"
base64 = "0.22.1"
dryoc = "0.8.0"
iroh-blobs = "0.103.0"
# StreamExt for consuming iroh-blobs' fetch-progress stream (same crate iroh-blobs uses), so a
# download can be aborted mid-stream once it crosses the blob-size cap.
n0-future = "0.3"
diffy = "0.5"

# media ingest transcoder: decode arbitrary bitmap uploads (PURE-RUST decoders
# only - no C libs) and re-encode to canonical AVIF + thumbnail. See src/media.rs.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "tiff",
    "webp",
    "qoi",
] }
# AVIF encoder. default-features disabled to drop rav1e's `asm` feature, which
# would require nasm and pull a non-pure-rust build step.
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = "0.8"
imgref = "1"
# Pure-rust AV1 decoder (no asm: no nasm build step). Drives AVIF *ingest* - we
# decode the container's AV1 bitstream and convert YUV->RGBA ourselves. See
# src/media.rs. bitdepth_8 + bitdepth_16 (both pure-rust) so we can decode the
# 10/12-bit AVIFs common among foreign uploads; `asm` stays off (it needs nasm).
rav1d = { version = "1.1.0", default-features = false, features = [
    "bitdepth_8",
    "bitdepth_16",
] }
# Pure-rust AVIF (ISOBMFF) container parser: extracts the primary AV1 item (and
# alpha item) bitstream and its sequence-header dimensions for the bomb guard.
# Also used by the media tests to verify produced AVIF output. Kept pure-rust on
# purpose (the `image` crate's `avif-native` feature would link dav1d, a C lib).
avif-parse = "2"

# --- video crush pipeline (src/video.rs) ---
# Pure-rust WebM/Matroska demux + mux (EBML). Used to read the client's
# AV1-in-WebM intermediary and to write our crushed WebM output.
webm-iterable = "0.6"
# Pure-rust Ogg container reader: extracts Opus packets from the client's
# separate Ogg Opus audio blob for PASSTHROUGH into the WebM mux (never decoded).
ogg = "0.9"
# AV1 *encoder* for the crushed video output. Exactly the no-default-features
# recipe ravif already uses in this tree (same version, zero new compilation),
# which keeps the `asm` feature (and its nasm build dep) off.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
# APNG encoder for the transparent-and-silent output route. Already in the tree
# as `image`'s PNG backend; adding it as a direct dep costs nothing.
png = "0.18"

# --- audio crush pipeline (src/audio.rs) ---
# Pure-rust demux + decode for the wild audio zoo (MP3, AAC-in-M4A, FLAC,
# WAV/PCM, Vorbis-in-Ogg). Every upload is hostile; symphonia is the
# memory-safe decode wall. No default features: exactly the codec set we
# accept, nothing more.
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "flac",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
] }
# Opus ENCODER: the c2rust transpile of the REFERENCE C libopus - the same
# battle-tested DSP, compiled as pure rust with no C toolchain (the vendored C
# -sys crates all require cmake). Its API is the raw C one, so audio.rs keeps
# a small contained unsafe glue around it, the same precedent as the rav1d
# glue in media.rs/video.rs. The from-scratch pure-rust `opus-rs` port was
# tried first and disqualified by measurement: it reads uninitialised memory
# on some encode paths and emits garbage packets in a long-lived process (the
# loudness regression test in audio.rs now stands guard, with an independent
# ffmpeg referee where ffmpeg is installed).
unsafe-libopus = "0.2"
# Pure-rust resampler: Opus only accepts 8/12/16/24/48 kHz input and we encode
# at 48 kHz, so anything else (44.1k above all) is FFT-resampled in streamed
# chunks. See src/audio.rs.
rubato = "4"
gethostname = "1.1.0"
flate2 = "1.1.9"
blake3 = "1.8.5"
