<!DOCTYPE html>
<html>
<head>
    $HEAD$
    <meta name="app-version" content="$VERSION$">$BRANCH$
    <script>
        // The colourway before anything draws (Curtis, 2026-10-02: the bundle put it on after the
        // first paint, and the light default flashed): a person's page wears theirs, which its
        // head names; anywhere else, the one this browser last wore (colorway.js keeps it). The
        // names are colorway.js's COLORWAYS - a pure test holds the two lists together.
        try {
            var colorways = ['horse-relax', 'witchlight', 'doors-xp', 'bosc', 'micross', 'terminal', 'terminal-white', 'terminal-cyan', 'terminal-orange', 'terminal-gold', 'pride', 'trans', 'bi', 'ace'];
            var named = document.querySelector('meta[name="page-colorway"]');
            var colorway = named ? named.content : localStorage.getItem('colorway');
            if (colorways.indexOf(colorway) >= 0) document.documentElement.dataset.colorway = colorway;
            // ...and the CRT screen, off if this browser last heard the persona turn it off
            // (crtpref.js keeps it), so it doesn't flash on before the setting arrives.
            if (localStorage.getItem('crt') === 'off') document.documentElement.dataset.crt = 'off';
        } catch (e) {
            /* no storage: the default until a profile says otherwise */
        }
        // The phone's system bars, before anything draws (2026-10-08): the Android app hands
        // their sizes over (MainActivity.kt, `__ringtomeInsets`) because its web view doesn't
        // reliably report them to CSS's env(). They become tokens.css's --safe-* on the root, and
        // again whenever they change - the app calls `__ringtomeInsetsChanged` on a rotation, and
        // a resize asks too. Anywhere else there is no bridge and env() stands.
        (function () {
            var bridge = window.__ringtomeInsets;
            if (!bridge) return;
            var apply = function () {
                try {
                    var insets = JSON.parse(bridge.get());
                    var style = document.documentElement.style;
                    // Only what the app has measured: before its first report it answers {}, and
                    // env() stands until then.
                    ['top', 'right', 'bottom', 'left'].forEach(function (side) {
                        if (typeof insets[side] === 'number') style.setProperty('--safe-' + side, insets[side] + 'px');
                    });
                } catch (e) {
                    /* a bridge that answers badly: env() stands */
                }
            };
            window.__ringtomeInsetsChanged = apply;
            window.addEventListener('resize', apply);
            apply();
        })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="/static/$VERSION$/app.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
    <div id="app">
        <div class="app-main">
            <div class="loading-shell">
                <p>Loading&hellip;</p>
            </div>
        </div>
    </div>

    <script src="/static/$VERSION$/app.js"></script>
</body>
</html>
