[package]
name = "ringtome-proto"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The protocol layer: canonical bytes, hashing, signing, chain validation. Deliberately free of
# async runtimes, storage, HTTP, and clocks - this crate defines what any conformant
# implementation must reproduce, so it must not depend on anything node-shaped. Keep this
# dependency list tiny.
[dependencies]
blake3 = "1"
ed25519-dalek = "2"
thiserror = "2"
unicode-normalization = "0.1"

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
