[package]
name = "groovelet"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3 # (this is already the default, we're just being specific)
lto = true
codegen-units = 1
strip = "debuginfo"


[dependencies]

# this is the basic-ass shit you need to put together a web service
async-trait = "0.1.85"
axum = { version = "0.8.1", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10.0", features = ["cookie", "tracing"] }
axum-macros = "0.5.0"
rand = "0.8.5"
anyhow = "1.0.95"
tokio = { version = "1.42.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.1", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features=["derive"]}
serde_json = "1.0"
uuid = { version = "1.14.0", features=["v4", "fast-rng", "serde", "macro-diagnostics"] }
sqlx = { version = "0.8.3", features=["runtime-tokio", "sqlite", "uuid", "chrono"] }
slugify = "0.1.0"
regex = "1.11.1"
validator = { version = "0.20.0", features=["derive"] }

# websockets
futures-util = { version="0.3.31" }

# we use sha2 for gravatar hashes
sha2 = { version="0.10.9" }

# both time and chrono. don't ask why, it's dumb
time = "0.3"
chrono = "0.4.39"

# password hashing
argon2 = "0.5.3"

# AWS!
aws-config = "1.5.16"
aws-sdk-sns = "1.60.0"
aws-sdk-sesv2 = "1.67.0"

# concurrency & local memory
moka = { version = "0.12.10", features=["future"] }
papaya = { version="0.2.3" }

# image processing
image = { version="0.25.8" }
base64 = { version="0.22.1"}
webp = "0.3"